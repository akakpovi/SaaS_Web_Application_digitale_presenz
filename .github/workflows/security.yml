name: Security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bandit:
    name: Bandit (Python SAST)
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Bandit
        run: python -m pip install "bandit[toml]==1.8.6"

      - name: Run Bandit
        run: |
          bandit -r SaaS_Web_Application_digitale_presenz_v2/backend \
            -x "*/migrations/*,*/tests/*,*/__pycache__/*" \
            -f sarif -o bandit-results.sarif --exit-zero

      - name: Upload Bandit SARIF
        if: always() && hashFiles('bandit-results.sarif') != ''
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: bandit-results.sarif
          category: bandit
        continue-on-error: true

  pip-audit:
    name: pip-audit (Python dependencies)
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: SaaS_Web_Application_digitale_presenz_v2/backend/requirements.txt

      - name: Install pip-audit
        run: python -m pip install pip-audit

      - name: Audit Python dependencies
        working-directory: SaaS_Web_Application_digitale_presenz_v2/backend
        run: |
          pip-audit -r requirements.txt \
            --desc on --format json -o pip-audit-results.json
        continue-on-error: true

      - name: Upload pip-audit report
        if: always() && hashFiles('SaaS_Web_Application_digitale_presenz_v2/backend/pip-audit-results.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: pip-audit-results
          path: SaaS_Web_Application_digitale_presenz_v2/backend/pip-audit-results.json
          retention-days: 30
        continue-on-error: true

  pnpm-audit:
    name: pnpm audit (frontend dependencies)
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 12.18.0

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm
          cache-dependency-path: SaaS_Web_Application_digitale_presenz_v2/SaaS_Web_Application_UI_UX_frontendV2/pnpm-lock.yaml

      - name: Audit frontend dependencies
        working-directory: SaaS_Web_Application_digitale_presenz_v2/SaaS_Web_Application_UI_UX_frontendV2
        run: |
          pnpm install --frozen-lockfile
          pnpm audit --audit-level=high
        continue-on-error: true

  gitleaks:
    name: Gitleaks (secret scan)
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan git history for secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}
        continue-on-error: true
