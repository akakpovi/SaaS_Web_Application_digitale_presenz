name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ruff
        run: pip install ruff==0.17.4

      - name: Ruff check
        # Blocking baseline: syntax and undefined-name rules from backend/ruff.toml.
        run: ruff check SaaS_Web_Application_digitale_presenz_v2/backend

      - name: Ruff format check
        # Blocking: the backend is formatted with Ruff 0.17.4.
        run: ruff format --check SaaS_Web_Application_digitale_presenz_v2/backend

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: SaaS_Web_Application_digitale_presenz_v2/backend

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: presence
          POSTGRES_USER: presence
          POSTGRES_PASSWORD: test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: SaaS_Web_Application_digitale_presenz_v2/backend/requirements.txt

      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libpq-dev gcc libpango-1.0-0 libpangocairo-1.0-0 \
            libcairo2 libgdk-pixbuf-2.0-0 libffi-dev shared-mime-info

      - name: Install Python deps
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Pricing catalogue consistency
        working-directory: .
        run: python scripts/check_pricing_sync.py

      - name: Django checks
        env: &django-env
          DJANGO_SETTINGS_MODULE: config.settings.test
          DJANGO_SECRET_KEY: test-secret-key-for-ci-only-not-production
          DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,testserver
          POSTGRES_DB: presence
          POSTGRES_USER: presence
          POSTGRES_PASSWORD: test_password
          POSTGRES_HOST: localhost
          POSTGRES_PORT: 5432
          REDIS_URL: redis://localhost:6379/0
          CELERY_BROKER_URL: redis://localhost:6379/1
          CELERY_RESULT_BACKEND: redis://localhost:6379/2
        run: |
          python manage.py migrate --noinput
          python manage.py check --deploy

      - name: Run tests
        env: *django-env
        run: python manage.py test --noinput

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: SaaS_Web_Application_digitale_presenz_v2/SaaS_Web_Application_UI_UX_frontendV2

    steps:
      - uses: actions/checkout@v4
        with:
          # The snapshot freshness check needs the commit that last changed
          # the snapshot, not a one-commit shallow checkout.
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 12.18.0

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm
          cache-dependency-path: SaaS_Web_Application_digitale_presenz_v2/SaaS_Web_Application_UI_UX_frontendV2/pnpm-lock.yaml

      - name: Install deps
        run: pnpm install --frozen-lockfile

      - name: Check blog snapshot freshness
        # Warning only: a stale snapshot must be visible in the logs without
        # blocking unrelated frontend changes.
        run: node scripts/check-snapshot-freshness.mjs --max-age-days 14
        continue-on-error: true

      - name: Typecheck
        run: pnpm exec tsc --noEmit

      - name: Build + prerender
        env:
          VITE_API_BASE_URL: /api/v1
          VITE_BASE_URL: https://presence.example
          VITE_WP_API_URL: /cms
          PRERENDER_WP_API_URL: ""
        run: pnpm run build

      - name: Verify prerendered output
        # `pnpm run build` already runs the full SEO gate
        # (scripts/check-seo-build.mjs) against these files; these greps keep a
        # human-readable floor for a few of them.
        run: |
          grep -q "Website-Monitoring: einfache Preise" dist/pricing/index.html
          grep -q "Simple Website Monitoring Pricing" dist/en/pricing/index.html
          grep -q 'lang="en"' dist/en/pricing/index.html
          grep -q 'lang="fr"' dist/fr/pricing/index.html
          grep -q "<loc>https://presence.example/pricing</loc>" dist/sitemap.xml
          grep -q "<loc>https://presence.example/en/pricing</loc>" dist/sitemap.xml
          grep -q "<loc>https://presence.example/fr/pricing</loc>" dist/sitemap.xml
          test -f dist/404.html
          # Blog articles are pre-rendered only when the headless CMS is
          # reachable at build time; the listing page always exists.
          test -f dist/blog/index.html

  e2e:
    name: E2E Tests (i18n)
    runs-on: ubuntu-latest
    needs: [frontend]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 12.18.0

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm
          cache-dependency-path: SaaS_Web_Application_digitale_presenz_v2/SaaS_Web_Application_UI_UX_frontendV2/pnpm-lock.yaml

      - name: Install frontend deps
        working-directory: SaaS_Web_Application_digitale_presenz_v2/SaaS_Web_Application_UI_UX_frontendV2
        run: pnpm install --frozen-lockfile

      - name: Install Chromium
        working-directory: SaaS_Web_Application_digitale_presenz_v2/SaaS_Web_Application_UI_UX_frontendV2
        run: pnpm exec playwright install chromium

      - name: Create CI environment file
        # The Compose stack requires backend/.env, which is intentionally not
        # committed. Use the secret-free template copied into the checkout.
        run: |
          cp SaaS_Web_Application_digitale_presenz_v2/backend/.env.ci \
             SaaS_Web_Application_digitale_presenz_v2/backend/.env

      - name: Create Umami env placeholder
        # Compose validates every env_file for `docker compose exec`, even
        # when Playwright only targets Redis. The real file is gitignored.
        run: |
          mkdir -p secrets
          cp secrets/umami.env.ci secrets/umami.env

      - name: Prepare local TLS for nginx
        # nginx/ssl is gitignored and absent from the checkout. Create a
        # throwaway self-signed certificate so the frontend can start.
        run: |
          mkdir -p nginx/ssl
          openssl req -x509 -nodes -newkey rsa:2048 -days 1 \
            -keyout nginx/ssl/presence.key \
            -out nginx/ssl/presence.crt \
            -subj "/CN=localhost" \
            -addext "subjectAltName=DNS:localhost,IP:127.0.0.1"
          cat > nginx/ssl/tls.conf <<'EOF'
          ssl_certificate     /etc/nginx/ssl/presence.crt;
          ssl_certificate_key /etc/nginx/ssl/presence.key;
          EOF

      - name: Start local stack
        run: docker compose up -d --build db redis web celery-worker mailpit frontend

      - name: Wait for API through nginx
        run: |
          for attempt in $(seq 1 60); do
            if curl -skf https://localhost/api/v1/health/ >/dev/null; then
              echo "API ready after ${attempt} attempt(s)"
              exit 0
            fi
            sleep 5
          done
          docker compose ps
          docker compose logs --tail=100 web frontend
          exit 1

      - name: Seed E2E test data
        env:
          E2E_EMAIL: ${{ secrets.E2E_EMAIL }}
          E2E_PASSWORD: ${{ secrets.E2E_PASSWORD }}
          E2E_WEBSITE_ID: ${{ secrets.E2E_WEBSITE_ID }}
        run: |
          docker compose exec -T \
            -e E2E_EMAIL="$E2E_EMAIL" \
            -e E2E_PASSWORD="$E2E_PASSWORD" \
            -e E2E_WEBSITE_ID="$E2E_WEBSITE_ID" \
            web python scripts/seed_e2e.py

      - name: Run French i18n E2E
        working-directory: SaaS_Web_Application_digitale_presenz_v2/SaaS_Web_Application_UI_UX_frontendV2
        env:
          E2E_EMAIL: ${{ secrets.E2E_EMAIL }}
          E2E_PASSWORD: ${{ secrets.E2E_PASSWORD }}
          E2E_WEBSITE_ID: ${{ secrets.E2E_WEBSITE_ID }}
        run: pnpm exec playwright test e2e/i18n-french.spec.ts

      - name: Upload Playwright artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-artifacts
          path: |
            SaaS_Web_Application_digitale_presenz_v2/SaaS_Web_Application_UI_UX_frontendV2/test-results/
            SaaS_Web_Application_digitale_presenz_v2/SaaS_Web_Application_UI_UX_frontendV2/playwright-report/
          if-no-files-found: ignore
          retention-days: 7

  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Build web and frontend images
        run: docker compose build web frontend
