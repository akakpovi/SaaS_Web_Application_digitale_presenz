{% load i18n %}
<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><title>{% trans "Rapport de présence digitale" %}</title></head>
<body style="font-family: Arial, sans-serif; line-height: 1.6; color: #333; max-width: 600px; margin: 0 auto; padding: 20px;">
    <div style="background-color: #2563eb; padding: 20px; text-align: center; border-radius: 8px 8px 0 0;">
        <h1 style="color: white; margin: 0; font-size: 24px;">Presence SaaS</h1>
    </div>
    <div style="background-color: #ffffff; padding: 30px; border: 1px solid #e5e7eb; border-radius: 0 0 8px 8px;">
        <h2>{% trans "Rapport de santé pour" %} {{ website.domain }}</h2>
        <div style="text-align: center; margin: 30px 0;">
            <div style="font-size: 48px; font-weight: bold; color: #2563eb;">{{ score }}/100</div>
            <p style="font-size: 16px; color: #6b7280;">{% trans "Score global de présence" %}</p>
        </div>
        <div style="text-align: center; margin-top: 30px;">
            <a href="{{ cta_url }}" style="display: inline-block; background-color: #2563eb; color: white; padding: 12px 24px; text-decoration: none; border-radius: 6px; font-weight: bold;">
                {% trans "Voir les détails complets et créer un compte gratuit" %}
            </a>
        </div>
    </div>
</body>
</html>
