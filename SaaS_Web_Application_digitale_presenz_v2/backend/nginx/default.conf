upstream presence_backend {
    server web:8000;
    keepalive 32;
}

# OAuth callback URLs carry `code` and `state`; never write the query string
# to an access log.  Log only the method and normalized path.
log_format presence_access '$remote_addr - $remote_user [$time_local] '
                           '"$request_method $uri $server_protocol" $status $body_bytes_sent '
                           '$request_time';

server {
    listen 80;
    server_name _;
    client_max_body_size 1m;
    access_log /var/log/nginx/access.log presence_access;

    location /static/ {
        alias /var/www/static/;
        access_log off;
        expires 7d;
    }

    location / {
        proxy_pass http://presence_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
    }
}
