id: presence-cors-credentials

info:
  name: Presence - CORS reflected origin with credentials
  author: Presence
  severity: medium
  description: |
    The server reflects an arbitrary Origin and allows credentials. A wildcard
    Access-Control-Allow-Origin without credentials is not reported, because
    it is not equivalent to a credentialed cross-origin read.
  reference:
    - https://owasp.org/www-project-top-ten/2017/A5_2017-Broken_Access_Control
    - https://developer.mozilla.org/en-US/docs/Web/HTTP/CORS
    - https://fetch.spec.whatwg.org/
  metadata:
    max-request: 1
    verified: true
  tags: presence,cors,misconfig

http:
  - method: GET
    path:
      - "{{BaseURL}}/"

    headers:
      Origin: https://presence-cors-test.invalid

    matchers-condition: and
    matchers:
      - type: regex
        part: header
        regex:
          - '(?i)access-control-allow-origin:\s*https://presence-cors-test\.invalid'

      - type: regex
        part: header
        regex:
          - '(?i)access-control-allow-credentials:\s*true'

      - type: status
        status:
          - 200
