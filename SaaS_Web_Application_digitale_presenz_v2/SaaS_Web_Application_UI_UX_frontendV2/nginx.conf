# Presence — nginx (frontend V2 + terminaison TLS)
#
# - 80  : challenge ACME Let's Encrypt, puis redirection 301 vers HTTPS
# - 443 : TLS + SPA pré-rendue + proxy API
#
# Les pages publiques sont pré-rendues au build (scripts/prerender.mjs) :
# chaque route connue possède son index.html.  Toute URL inconnue reçoit un
# vrai 404 (et non un index.html en 200), ce qui supprime les soft 404.
#
# Bilingue : l'allemand occupe l'URL nue (`/pricing`), l'anglais sa propre URL
# (`/en/pricing`).  Chacune a son HTML pré-rendu, donc un crawler sans
# JavaScript reçoit la bonne langue.  L'ancienne forme `?lang=en` reste
# acceptée mais n'est plus une URL : elle répond 301 vers `/en/...` (carte
# générée depuis src/seo/publicPaths.ts, incluse plus bas).  La sélection de la
# langue ne dépend ni d'Accept-Language ni d'un en-tête, donc aucune réponse ne
# varie selon le client et aucun cache intermédiaire n'a besoin de `Vary`.
#
# `/_i18n/` ne survit que pour les cinq écrans noindex (login, register,
# forgot-password, reset-password, onboarding) : ils n'ont pas de version
# anglaise publique, donc leur `?lang=en` continue de servir directement la
# coquille anglaise au lieu de rediriger vers une URL qui n'existe pas.
#
# Certificats : /etc/nginx/ssl/tls.conf est inclus ci-dessous. Il pointe vers
# le certificat auto-signé en local, et scripts/enable_letsencrypt.sh le
# remplace par les chemins Let's Encrypt lors du déploiement public.

# Les access logs ne contiennent JAMAIS la query string.  Le callback OAuth
# reçoit `code` et `state` en paramètres : les journaliser, même dans un fichier
# de log, reviendrait à écrire des secrets éphémères sur le disque.  On loggue
# uniquement la méthode et le chemin normalisé ($uri), sans referer ni
# user-agent (qui peuvent aussi être contrôlés par le client).
log_format presence_access '$remote_addr - $remote_user [$time_local] '
                           '"$request_method $uri $server_protocol" $status $body_bytes_sent '
                           '$request_time';

# Variante linguistique des coquilles pré-rendues.  Ne s'applique plus qu'aux
# routes noindex : pour les pages publiques, la redirection 301 ci-dessous est
# évaluée avant la sélection de location et le fichier `_i18n` n'est même plus
# généré par le build.
map $arg_lang $html_variant {
    default "";
    en      "/_i18n";
}

# Redirections `?lang=` → URL canonique.  La carte est générée depuis
# src/seo/publicPaths.ts (scripts/generate-nginx-locale-map.mjs) : elle ne peut
# donc pas diverger de la liste des routes bilingues du routeur React.
include /etc/nginx/conf.d/presence-locale-map.conf;

server {
    listen 80;
    server_name _;

    # Remplace l'access_log hérité de /etc/nginx/nginx.conf (format `main`,
    # qui contient $request, donc la query string).
    access_log /var/log/nginx/access.log presence_access;

    # Renouvellement Let's Encrypt (webroot), doit rester en HTTP.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name _;

    access_log /var/log/nginx/access.log presence_access;

    root /usr/share/nginx/html;
    index index.html;

    include /etc/nginx/ssl/tls.conf;

    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "same-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    client_max_body_size 1m;

    # --- ?lang= → URL canonique (301) ------------------------------------
    # "/pricing?lang=en" et "/pricing?lang=de" ne sont plus des URLs : ce sont
    # des vestiges de l'ancienne forme bilingue.  `$presence_locale_redirect`
    # vaut la cible pour les 29 routes publiques, et reste vide partout ailleurs
    # (routes privées, articles, assets, API), donc ces requêtes ne sont pas
    # touchées.
    #
    # `$presence_locale_query` recolle les autres paramètres (`utm_*`, etc.) dans
    # leur ordre d'origine, ou reste vide quand `lang` était seul : une campagne
    # garde son attribution malgré la migration.
    #
    # L'URL est construite explicitement plutôt que laissée à `return 301 /…` :
    # nginx absolutiserait la cible avec son port d'écoute interne (`:443`),
    # ce qui casse la redirection dès que le conteneur est publié sur un autre
    # port (vérification locale, préproduction). `$http_host` reprend l'hôte et
    # le port réellement demandés, donc la cible reste celle que le client a
    # utilisée — jamais une valeur devinée depuis `server_name`.
    if ($presence_locale_redirect != "") {
        return 301 $scheme://$http_host$presence_locale_redirect$presence_locale_query;
    }

    # --- API Django -------------------------------------------------------
    # proxy_pass via variable + resolver Docker : l'IP du conteneur `web` est
    # ré-résolue, sinon nginx garde l'ancienne IP après un redéploiement et
    # renvoie 502 jusqu'à son redémarrage.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api_upstream http://web:8000;

    location /api/ {
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;

        # Django renvoie `Referrer-Policy: no-referrer` sur la redirection du
        # callback pour que le navigateur ne transmette pas `code`/`state` à
        # React.  On masque la valeur du header upstream et on force la même
        # politique, car le `add_header` du bloc server est sinon ajouté en
        # plus (deux valeurs contradictoires).
        proxy_hide_header Referrer-Policy;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    }

    # --- CMS WordPress headless ------------------------------------------
    # Le blog lit /cms/wp-json/... en same-origin : pas de CORS, et l'admin
    # WordPress n'est pas exposé (seuls l'API REST et les médias le sont).
    set $cms_upstream http://wordpress:80;

    location /cms/wp-json/ {
        rewrite ^/cms/(.*)$ /$1 break;
        proxy_pass $cms_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 30s;
    }

    location /cms/wp-content/ {
        rewrite ^/cms/(.*)$ /$1 break;
        proxy_pass $cms_upstream;
        proxy_set_header Host $host;
        expires 7d;
        add_header Cache-Control "public, max-age=604800" always;
    }

    location /cms/ {
        return 404;
    }

    # --- Mesure d'audience (Umami), servie depuis notre propre origine ------
    # Same-origin : pas de domaine tiers, donc pas de CORS, pas de CSP à ouvrir
    # et pas de script bloqué par les listes anti-traceurs.  Umami n'est
    # joignable que par ce proxy (aucun port publié) : l'administration passe
    # par un tunnel SSH vers son port 3000, jamais par une URL publique.
    #
    # Seuls le script de mesure et l'API de collecte sont exposés ; tout le
    # reste du préfixe reste fermé, exactement comme `/cms/`.
    #
    # Upstream en variable + resolver Docker (même motif que `web` et
    # `wordpress`) : si Umami est arrêté, nginx répond 502 au lieu de refuser
    # de démarrer, et l'IP est ré-résolue après un redéploiement.
    set $umami_upstream http://umami:3000;

    location = /stats/script.js {
        rewrite ^ /script.js break;
        proxy_pass $umami_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 10s;
        # Pas de `expires` ni de `add_header Cache-Control` ici : Umami envoie
        # déjà sa propre politique (`public, max-age=86400, must-revalidate`),
        # et deux valeurs concurrentes rendraient le cache indéterminé.
        # `add_header` dans un bloc location désactive l'héritage du bloc
        # server : les en-têtes de sécurité sont donc répétés ici.

        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "same-origin" always;
    }

    location /stats/api/ {
        rewrite ^/stats/(.*)$ /$1 break;
        proxy_pass $umami_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 10s;
    }

    location /stats/ {
        return 404;
    }

    # --- Assets hashés : cache long --------------------------------------
    location /assets/ {
        alias /usr/share/nginx/html/assets/;
        add_header Cache-Control "public, immutable, max-age=31536000" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "same-origin" always;
        try_files $uri =404;
    }

    # --- Entrées privées localisées ---------------------------------------
    # `/fr/app/...`, `/fr/login`, `/en/login`, `/de/login`… n'ont pas de HTML
    # pré-rendu. Le routeur React redirige vers l'URL nue en conservant
    # `?lang=fr|en|de`, donc nginx sert la coquille SPA et laisse React faire
    # la redirection. Les pages publiques `/fr/...` restent servies par
    # `location /` ci-dessous et ne passent jamais par ce bloc.
    location ~ ^/(de|en|fr)/(app|login|register|forgot-password|reset-password|verify-email|onboarding|settings/integrations|admin|report|scan)(/|$) {
        # Coquille privée sans `data-ssg` : `main.tsx` utilise createRoot, pas
        # hydrateRoot. Servir la page d'accueil pré-rendue ici provoquerait une
        # erreur React #418 (le HTML de la landing ne correspond pas à la route).
        try_files $uri /login/index.html;
    }

    # --- Application authentifiée (client-side routing) -------------------
    # /app/*, /report/* et /admin n'ont pas de HTML pré-rendu : ils sont
    # privés et noindex, nginx sert donc la coquille SPA.
    location /app/ {
        try_files $uri /login/index.html;
    }
    # Short URL used by OAuth documentation and external links. The React
    # route immediately redirects into /app/settings/integrations, but the
    # request must reach the SPA shell instead of the generic 404 rule.
    location = /settings/integrations {
        try_files /login/index.html =404;
    }
    location /report/ {
        try_files $uri /login/index.html;
    }
    # Dynamic public pages: a scan id or an e-mail token cannot be
    # pre-rendered, so the SPA shell must answer here instead of the generic
    # pre-rendered rule below (which would return a hard 404).
    location /scan/ {
        try_files $uri /login/index.html;
    }
    location = /verify-email {
        try_files /login/index.html =404;
    }
    # Blog dynamique : les articles publiés après le build n'ont pas de HTML
    # pré-rendu. Ils sont servis par la SPA (le contenu vient de WordPress).
    location /blog/ {
        try_files $uri/index.html /blog/index.html;
    }
    location = /admin {
        try_files /login/index.html =404;
    }

    # --- Coquilles anglaises --------------------------------------------
    # `/_i18n/**` n'est jamais une URL publique : le dossier n'est servi que
    # par la résolution de `location /` ci-dessous (qui ne ré-évalue pas les
    # locations), ce qui évite un contenu dupliqué adressable.
    location /_i18n/ {
        internal;
    }

    # --- Pages publiques pré-rendues -------------------------------------
    # $uri/index.html en premier : /pricing sert directement le fichier
    # pré-rendu, sans redirection 301 vers /pricing/ (qui casserait le
    # canonical et dupliquerait l'URL).
    # `$html_variant` ne sert plus que les cinq écrans noindex (leur anglais
    # n'a pas d'URL dédiée).  Pour une page publique, `?lang=en` a déjà été
    # redirigé en 301 et aucun fichier `_i18n` n'est généré : le repli allemand
    # ci-dessous ne s'applique donc jamais à une route publique.
    location / {
        try_files $html_variant$uri/index.html $uri/index.html $uri =404;
    }

    # --- Vraie page 404 ---------------------------------------------------
    error_page 404 /404.html;
    location = /404.html {
        internal;
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript application/ld+json;
    gzip_min_length 1000;
}
