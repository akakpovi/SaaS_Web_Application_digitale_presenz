server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Proxy API vers le backend Django
    location /api/ {
        proxy_pass http://web:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    # Proxy static Django admin + DRF browsable API
    location /static/ {
        proxy_pass http://web:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # Proxy admin Django
    location /admin/ {
        proxy_pass http://web:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── Prerendered pages — meta statiques pour crawlers ──

    # Prerendered: /
    location = / {
        root /usr/share/nginx/html/prerender;
        index home.html;
        add_header X-Prerendered "true" always;
        add_header Cache-Control "public, max-age=3600" always;
    }

    # Prerendered: /pricing
    location = /pricing {
        alias /usr/share/nginx/html/prerender/pricing.html;
        add_header X-Prerendered "true" always;
        add_header Cache-Control "public, max-age=3600" always;
    }

    # Prerendered: /faq
    location = /faq {
        alias /usr/share/nginx/html/prerender/faq.html;
        add_header X-Prerendered "true" always;
        add_header Cache-Control "public, max-age=3600" always;
    }

    # Prerendered: /blog
    location = /blog {
        alias /usr/share/nginx/html/prerender/blog.html;
        add_header X-Prerendered "true" always;
        add_header Cache-Control "public, max-age=3600" always;
    }

    # Prerendered: /features/website-monitoring
    location = /features/website-monitoring {
        alias /usr/share/nginx/html/prerender/features__website-monitoring.html;
        add_header X-Prerendered "true" always;
        add_header Cache-Control "public, max-age=3600" always;
    }

    # Prerendered: /features/ssl-monitoring
    location = /features/ssl-monitoring {
        alias /usr/share/nginx/html/prerender/features__ssl-monitoring.html;
        add_header X-Prerendered "true" always;
        add_header Cache-Control "public, max-age=3600" always;
    }

    # Prerendered: /features/dns-monitoring
    location = /features/dns-monitoring {
        alias /usr/share/nginx/html/prerender/features__dns-monitoring.html;
        add_header X-Prerendered "true" always;
        add_header Cache-Control "public, max-age=3600" always;
    }

    # Prerendered: /features/email-security
    location = /features/email-security {
        alias /usr/share/nginx/html/prerender/features__email-security.html;
        add_header X-Prerendered "true" always;
        add_header Cache-Control "public, max-age=3600" always;
    }

    # Prerendered: /features/uptime-monitoring
    location = /features/uptime-monitoring {
        alias /usr/share/nginx/html/prerender/features__uptime-monitoring.html;
        add_header X-Prerendered "true" always;
        add_header Cache-Control "public, max-age=3600" always;
    }

    # Prerendered: /features/website-performance
    location = /features/website-performance {
        alias /usr/share/nginx/html/prerender/features__website-performance.html;
        add_header X-Prerendered "true" always;
        add_header Cache-Control "public, max-age=3600" always;
    }

    # Prerendered: /features/security-headers
    location = /features/security-headers {
        alias /usr/share/nginx/html/prerender/features__security-headers.html;
        add_header X-Prerendered "true" always;
        add_header Cache-Control "public, max-age=3600" always;
    }

    # Prerendered: /features/review-monitoring
    location = /features/review-monitoring {
        alias /usr/share/nginx/html/prerender/features__review-monitoring.html;
        add_header X-Prerendered "true" always;
        add_header Cache-Control "public, max-age=3600" always;
    }

    # Prerendered: /tools/website-checker
    location = /tools/website-checker {
        alias /usr/share/nginx/html/prerender/tools__website-checker.html;
        add_header X-Prerendered "true" always;
        add_header Cache-Control "public, max-age=3600" always;
    }

    # Prerendered: /tools/ssl-checker
    location = /tools/ssl-checker {
        alias /usr/share/nginx/html/prerender/tools__ssl-checker.html;
        add_header X-Prerendered "true" always;
        add_header Cache-Control "public, max-age=3600" always;
    }

    # Prerendered: /tools/dns-checker
    location = /tools/dns-checker {
        alias /usr/share/nginx/html/prerender/tools__dns-checker.html;
        add_header X-Prerendered "true" always;
        add_header Cache-Control "public, max-age=3600" always;
    }

    # Prerendered: /tools/email-security-checker
    location = /tools/email-security-checker {
        alias /usr/share/nginx/html/prerender/tools__email-security-checker.html;
        add_header X-Prerendered "true" always;
        add_header Cache-Control "public, max-age=3600" always;
    }

    # React SPA - toutes les autres routes
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript;
    gzip_min_length 1000;
}
