# Presence — frontend nginx
#
# 80  : ACME challenge puis redirection HTTPS
# 443 : TLS, pages pré-rendues, proxy API/CMS, fallback SPA React
#
# Les certificats sont montés par docker-compose dans /etc/nginx/ssl.
# tls.conf pointe vers le certificat local auto-signé ou Let's Encrypt.

server {
    listen 80;
    server_name _;

    # Renouvellement Let's Encrypt : doit rester accessible en HTTP.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    include /etc/nginx/ssl/tls.conf;

    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "same-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    client_max_body_size 1m;

    # Re-résolution Docker après recréation de web/wordpress.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # --- API Django ------------------------------------------------------
    set $api_upstream http://web:8000;

    location /api/ {
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;

        # Django renvoie no-referrer sur le callback OAuth. On masque sa
        # valeur pour éviter deux en-têtes contradictoires, puis on répète
        # les en-têtes de sécurité (add_header dans un location désactive
        # l'héritage du bloc server).
        proxy_hide_header Referrer-Policy;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    }

    # --- Django admin et staticfiles ------------------------------------
    location /static/ {
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /admin/ {
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # --- CMS WordPress headless ------------------------------------------
    set $cms_upstream http://wordpress:80;

    location /cms/wp-json/ {
        rewrite ^/cms/(.*)$ /$1 break;
        proxy_pass $cms_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 30s;
    }

    location /cms/wp-content/ {
        rewrite ^/cms/(.*)$ /$1 break;
        proxy_pass $cms_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        expires 7d;
    }

    location /cms/ {
        return 404;
    }

    # --- Assets hashés ----------------------------------------------------
    location /assets/ {
        try_files $uri =404;
        expires 1y;
    }

    # --- Compatibilité URLs sans préfixe de langue -----------------------
    # Le routeur React utilise /:lang/... ; ces redirections gardent les
    # anciennes URLs d'entrée fonctionnelles sans dupliquer les routes.
    location = /login {
        return 302 /fr/login;
    }
    location = /dashboard {
        return 302 /fr/app/dashboard;
    }
    location = /websites {
        return 302 /fr/app/websites;
    }

    # --- Pages publiques pré-rendues -------------------------------------
    # Le fichier prerender/home.html du dépôt est un ancien shell qui pointe
    # encore vers /src/main.tsx (inexistant en production). Pour la racine,
    # servir le shell SPA construit, qui charge les assets hashés.
    location = / {
        try_files /index.html =404;
        expires 1h;
    }

    location = /pricing {
        alias /usr/share/nginx/html/prerender/pricing.html;
        expires 1h;
    }

    location = /faq {
        alias /usr/share/nginx/html/prerender/faq.html;
        expires 1h;
    }

    location = /blog {
        alias /usr/share/nginx/html/prerender/blog.html;
        expires 1h;
    }

    location = /features/website-monitoring {
        alias /usr/share/nginx/html/prerender/features__website-monitoring.html;
        expires 1h;
    }

    location = /features/ssl-monitoring {
        alias /usr/share/nginx/html/prerender/features__ssl-monitoring.html;
        expires 1h;
    }

    location = /features/dns-monitoring {
        alias /usr/share/nginx/html/prerender/features__dns-monitoring.html;
        expires 1h;
    }

    location = /features/email-security {
        alias /usr/share/nginx/html/prerender/features__email-security.html;
        expires 1h;
    }

    location = /features/uptime-monitoring {
        alias /usr/share/nginx/html/prerender/features__uptime-monitoring.html;
        expires 1h;
    }

    location = /features/website-performance {
        alias /usr/share/nginx/html/prerender/features__website-performance.html;
        expires 1h;
    }

    location = /features/security-headers {
        alias /usr/share/nginx/html/prerender/features__security-headers.html;
        expires 1h;
    }

    location = /features/review-monitoring {
        alias /usr/share/nginx/html/prerender/features__review-monitoring.html;
        expires 1h;
    }

    location = /tools/website-checker {
        alias /usr/share/nginx/html/prerender/tools__website-checker.html;
        expires 1h;
    }

    location = /tools/ssl-checker {
        alias /usr/share/nginx/html/prerender/tools__ssl-checker.html;
        expires 1h;
    }

    location = /tools/dns-checker {
        alias /usr/share/nginx/html/prerender/tools__dns-checker.html;
        expires 1h;
    }

    location = /tools/email-security-checker {
        alias /usr/share/nginx/html/prerender/tools__email-security-checker.html;
        expires 1h;
    }

    # --- SPA React -------------------------------------------------------
    location / {
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript application/ld+json;
    gzip_min_length 1000;
}
