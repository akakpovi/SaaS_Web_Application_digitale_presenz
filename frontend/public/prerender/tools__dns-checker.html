<!doctype html>
<html lang="<!-- figma:lang -->">
  <head>
    <!-- figma:head-start -->
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Free DNS Checker for Small Businesses & Restaurants | Presence</title>

    <!-- Primary meta -->
    <meta name="description" content="Check your restaurant or business DNS records for free. View A, AAAA, MX, NS and TXT records instantly. No account required." />
    <meta name="robots" content="index,follow" />
    <meta name="theme-color" content="#4f46e5" />

    <!-- Canonical (overridden per-page by react-helmet-async) -->
    <link rel="canonical" href="https://presence.io/tools/dns-checker" />

    <!-- Hreflang -->
    <link rel="alternate" hreflang="en" href="https://presence.io/" />
    <link rel="alternate" hreflang="fr" href="https://presence.io/fr/" />
    <link rel="alternate" hreflang="de" href="https://presence.io/de/" />
    <link rel="alternate" hreflang="x-default" href="https://presence.io/" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Presence" />
    <meta property="og:title" content="Free DNS Checker | Presence" />
    <meta property="og:description" content="Check your restaurant or business DNS records for free. View A, AAAA, MX, NS and TXT records instantly. No account required." />
    <meta property="og:url" content="https://presence.io/tools/dns-checker" />
    <meta property="og:image" content="https://presence.io/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:locale" content="en_US" />
    <meta property="og:locale:alternate" content="fr_FR" />
    <meta property="og:locale:alternate" content="de_DE" />

    <!-- Twitter/X Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@presenceio" />
    <meta name="twitter:title" content="Free DNS Checker | Presence" />
    <meta name="twitter:description" content="Check your restaurant or business DNS records for free. View A, AAAA, MX, NS and TXT records instantly. No account required." />
    <meta name="twitter:image" content="https://presence.io/og-image.png" />

    <!-- PWA -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Presence" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!-- figma:head-end -->

    <!-- Structured Data — Organization + WebSite -->
    <script type="application/ld+json">
    {"@context":"https://schema.org","@type":"Organization","name":"Presence","url":"https://presence.io","logo":"https://presence.io/icons/icon-512.png","description":"Digital presence monitoring for small businesses.","sameAs":[]}
    </script>
    <script type="application/ld+json">
    {"@context":"https://schema.org","@type":"WebSite","name":"Presence","url":"https://presence.io","potentialAction":{"@type":"SearchAction","target":"https://presence.io/tools/website-checker?q={search_term_string}","query-input":"required name=search_term_string"}}
    </script>
  </head>
  <body>
    <!-- figma:body-start -->
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <!-- figma:body-end -->
  </body>
</html>
